{% extends 'dashboard/base_dashboard.html' %}

{% block content %}
<h1>{% if product %}Edit Product{% else %}Add Product{% endif %}</h1>

<form method="post" enctype="multipart/form-data" class="form-card">
    {% csrf_token %}

    <label>Product Name</label>
    <input type="text" name="name" value="{{ product.name|default:'' }}" required>

    <label>Brand</label>
    <select name="brand" required>
        {% for brand in brands %}
        <option value="{{ brand.id }}" {% if product.brand.id == brand.id %}selected{% endif %}>
            {{ brand.name }}
        </option>
        {% endfor %}
    </select>

    <label>Category</label>
    <select name="category" required>
        {% for category in categories %}
        <option value="{{ category.id }}" {% if product.category.id == category.id %}selected{% endif %}>
            {{ category.name }}
        </option>
        {% endfor %}
    </select>

    <label>Gender</label>
    <select name="gender">
        <option value="men" {% if product.gender == 'men' %}selected{% endif %}>Men</option>
        <option value="women" {% if product.gender == 'women' %}selected{% endif %}>Women</option>
        <option value="kids" {% if product.gender == 'kids' %}selected{% endif %}>Kids</option>
        <option value="unisex" {% if product.gender == 'unisex' %}selected{% endif %}>Unisex</option>
    </select>

    <label>Description</label>
    <textarea name="description" required>{{ product.description|default:'' }}</textarea>

    <label>Price</label>
    <input type="number" step="0.01" name="price" value="{{ product.price|default:'' }}" required>

    <label>Discount Price</label>
    <input type="number" step="0.01" name="discount_price" value="{{ product.discount_price|default:'' }}">

    <label>Stock</label>
    <input type="number" name="stock" value="{{ product.stock|default:'' }}" required>

    <label>Available Sizes</label>
    <input type="text" name="available_sizes" value="{{ product.available_sizes|default:'' }}" placeholder="6,7,8,9,10" required>

    <label>Product Image</label>
    <input type="file" name="image" {% if not product %}required{% endif %}>

    <label>
        <input type="checkbox" name="is_active" {% if product.is_active or not product %}checked{% endif %}>
        Active
    </label>

    <label>
        <input type="checkbox" name="is_featured" {% if product.is_featured %}checked{% endif %}>
        Featured
    </label>

    <button class="btn">Save Product</button>
</form>
{% endblock %}
